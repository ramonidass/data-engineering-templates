_subdirectory: "template"

project_name:
  type: str
  help: What should the pipeline name be?
  placeholder: my-project
  validator: >-
    {% if not (project_name | regex_search('^[a-z][a-z0-9\-]*$')) %}
    project name should be kebab-case and lowercase
    {% endif %}

product_name_display:
  type: str
  help: What is the display name for your product? (e.g., "My Product")
  default: "{{ project_name | title | replace('-', ' ') }}"

project_name_snake:
  type: str
  default: "{{ project_name | replace('-', '_') }}"
  when: false

adapter:
  type: str
  help: Which warehouse does this pipeline run against?
  choices:
    - bigquery
    - snowflake
    - databricks
    - duckdb

sqlfluff_dialect:
  type: str
  default: "{{ {'bigquery': 'bigquery', 'snowflake': 'snowflake', 'databricks': 'databricks', 'duckdb': 'duckdb'}[adapter] }}"
  when: false

python_version:
  type: str
  help: What python version is this project going to use?
  default: "3.12"
  validator: >-
    {% if not (python_version | regex_search('^3\.[0-9][0-9]?$')) %}
    A valid python version looks like 3.12
    {% endif %}

sql_line_length:
  type: int
  default: 100
  help: The line length for sql scripts.
  validator: >-
    {% if sql_line_length < 80 or sql_line_length > 120 %}
    sql line length should be between 80 and 120.
    {% endif %}

python_line_length:
  type: int
  help: Maximum python line length (used by ruff)
  default: 88
  validator: >-
    {% if python_line_length < 80 or python_line_length > 200 %}
    The line length should be between 80 and 200
    {% endif %}
