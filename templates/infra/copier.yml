_subdirectory: "template"

project_name:
  type: str
  help: What is your project name?
  placeholder: my-project
  validator: >-
    {% if not (project_name | regex_search('^[a-z][a-z0-9\-]*$')) %}
    project_name must start with a letter, followed by letters, digits or dashes,
    all lowercase.
    {% endif %}

product_name_display:
  type: str
  help: What is the display name for your product? (e.g., "My Product")
  default: "{{ project_name | title | replace('-', ' ') }}"

product_name_flatcase:
  type: str
  default: "{{ project_name | replace('-','') }}"
  when: false

cloud:
  type: str
  help: Which cloud does this infrastructure target?
  choices:
    - gcp
    - aws
    - azure

iac_tool:
  type: str
  help: Terraform (requires unfree nixpkgs) or OpenTofu (fully open source)?
  choices:
    - opentofu
    - terraform
  default: opentofu

tf_binary:
  type: str
  default: "{{ 'tofu' if iac_tool == 'opentofu' else 'terraform' }}"
  when: false

state_bucket_pattern:
  type: str
  help: Remote-state bucket / storage-account naming pattern ({env} is substituted)
  default: "{{ '{env}-tfstate-' ~ product_name_flatcase if cloud != 'azure' else 'st' ~ product_name_flatcase ~ '{env}tf' }}"

region:
  type: str
  help: Default region for resources
  default: "{{ 'europe-west2' if cloud == 'gcp' else ('eu-west-1' if cloud == 'aws' else 'westeurope') }}"
